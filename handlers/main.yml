# handlers/main.yml
# Handlers for PostgreSQL service management
---
- name: restart firewalld
  systemd:
    name: "firewalld"
    state: restarted

- name: restart postgresql
  systemd:
    name: "{{ _pg_service }}"
    state: restarted

- name: reload postgresql
  systemd:
    name: "{{ _pg_service }}"
    state: reloaded
